<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI-Based Loan Prediction</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="navbar">
        <a href="/">Home</a>
        <a href="/about">About</a>
        <a href="/models">Model Comparison</a>
        <a href="/results">Results</a>
    </div>
    <div class="container">
        <h1>AI-Based Loan Prediction System</h1>
        <p class="subtitle">Enter applicant details to predict loan approval</p>
        <form action="/predict" method="post">
            <div class="row two-columns">
                <div class="field">
                    <label>Dependents</label>
                    <input type="number" name="dependents" min="0" max="5" required>
                </div>

                <div class="field">
                    <label>Education</label>
                    <select name="education" required>
                        <option value="0">Graduate</option>
                        <option value="1">Not Graduate</option>
                    </select>
                </div>
            </div>

            <div class="row two-columns">
                <div class="field">
                    <label>Self Employed</label>
                    <select name="self_employed" required>
                        <option value="1">Yes</option>
                        <option value="0">No</option>
                    </select>
                </div>

                <div class="field">
                    <label>Applicant Income (Per Annum)</label>
                    <input type="number" name="applicant_income" required>
                </div>
            </div>

            <div class="row two-columns">
                <div class="field">
                    <label>Loan Amount</label>
                    <input type="number" name="loan_amount" required>
                </div>

                <div class="field">
                    <label>Loan Term (months)</label>
                    <input type="number" name="loan_term" required>
                </div>
            </div>

            <div class="row two-columns">
                <div class="field">
                    <label>Credit History</label>
                    <input type="number" required name="credit_history" placeholder="300 - 900">
                </div>

                <div class="field">
                    <label>Residential Assets Value</label>
                    <input type="number" name="residential_assets_value" required>
                </div>
            </div>


            <div class="row two-columns">
                <div class="field">
                    <Label>Commercial assets value</Label>
                    <input type="number" name="commercial_assets_value" required>
                </div>
                <div class="field">
                    <Label>Luxury assets value</Label>
                    <input type="number" name="luxury_assets_value" required>
                </div>
            </div>
            <div class="row" style="width: 50%;">
                <Label>Bank assets value</Label>
                <input type="number" name="bank_asset_value" required >
            </div>

            <button type="submit">Predict Loan Status</button>
        </form>

        {% if prediction_text %}
            <div class="result">
                {{ prediction_text }}
            </div>
        {% endif %}
    </div>
</body>
</html>
